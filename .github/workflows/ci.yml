name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Types, Tests & Cloudflare Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint check
        run: npm run lint

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm test

      - name: Build Next.js application
        run: npm run build
        env:
          APP_URL: "http://localhost:3000"

      - name: Build Cloudflare OpenNext Worker
        run: npm run build:cloudflare
        env:
          APP_URL: "http://localhost:3000"

