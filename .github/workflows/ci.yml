name: 🚀 CI / CD — Jaayma

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Annule les runs en cours si un nouveau push arrive sur la même branche
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

# ─────────────────────────────────────────────────────────────
# JOB 1 — Lint + Types
# ─────────────────────────────────────────────────────────────
jobs:
  lint:
    name: 🔍 Lint & Types
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: ESLint
        run: npm run lint

      - name: TypeScript — vérification des types
        run: npx tsc --noEmit

# ─────────────────────────────────────────────────────────────
# JOB 2 — Tests unitaires
# ─────────────────────────────────────────────────────────────
  test:
    name: 🧪 Tests unitaires
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Vitest
        run: npm test -- --reporter=verbose

# ─────────────────────────────────────────────────────────────
# JOB 3 — Build Cloudflare (OpenNext)
# Lance en parallèle avec lint & test pour gagner du temps
# ─────────────────────────────────────────────────────────────
  build:
    name: 🏗️ Build Cloudflare Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Build OpenNext / Cloudflare Worker
        run: npm run build:cloudflare

      # Mise en cache de l'artefact de build pour le job deploy
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-worker-build
          path: .open-next/
          retention-days: 1
          if-no-files-found: error

# ─────────────────────────────────────────────────────────────
# JOB 4 — Deploy (uniquement sur push main, après lint+test+build OK)
# ─────────────────────────────────────────────────────────────
  deploy:
    name: 🌍 Deploy → Cloudflare Workers
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    # Ne déploie que sur push (pas sur les PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://jaayma-sn.jaayma.workers.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies (prod + wrangler)
        run: npm ci --prefer-offline

      # Récupère l'artefact du build (évite de rebuilder)
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: cloudflare-worker-build
          path: .open-next/

      - name: Deploy via Wrangler
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Résumé du déploiement
        run: |
          echo "## 🚀 Déploiement réussi" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Champ | Valeur |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Worker** | jaayma-sn |" >> $GITHUB_STEP_SUMMARY
          echo "| **URL** | https://jaayma-sn.jaayma.workers.dev |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branche** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Auteur** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
