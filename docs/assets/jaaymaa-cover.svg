<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="title description">
  <title id="title">Jaaymaa — ta boutique, en un lien</title>
  <desc id="description">Une plateforme sénégalaise pour présenter ses produits et gérer ses commandes.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
