  <text x="108" y="290" fill="#FFC83D" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="3">LE COMMERCE LOCAL, SIMPLEMENT</text>
  <text x="108" y="350" fill="#F8F6F0" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="600">Ta boutique, en un lien.</text>
  <text x="108" y="394" fill="#D7DFEF" font-family="Inter, Arial, sans-serif" font-size="19">Présente tes produits, reçois tes commandes et</text>
  <text x="108" y="423" fill="#D7DFEF" font-family="Inter, Arial, sans-serif" font-size="19">gère ton activité depuis un seul espace.</text>
