<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Chargement en cours" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Jaayma, chargement</title>
<style>
.ring{transform-origin:120px 120px;animation:spin 1.8s cubic-bezier(.65,.05,.35,.95) infinite}
.tile{transform-origin:120px 120px;animation:breathe 2.4s ease-in-out infinite}
.j{stroke-dasharray:100;stroke-dashoffset:100;animation:draw 2.4s ease-in-out infinite}
.dot{transform-box:fill-box;transform-origin:50% 100%;animation:drop 2.4s infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.05) rotate(-3deg)}}
@keyframes draw{0%{stroke-dashoffset:100}35%,80%{stroke-dashoffset:0}95%,100%{stroke-dashoffset:-100}}
@keyframes drop{
0%,4%{transform:translateY(-44px) scale(1,1);opacity:0;animation-timing-function:cubic-bezier(.55,0,1,.45)}
22%{transform:translateY(0) scale(1,1);opacity:1}
25%{transform:translateY(0) scale(1.3,.7);animation-timing-function:ease-out}
31%{transform:translateY(-12px) scale(.9,1.1);animation-timing-function:ease-in}
37%{transform:translateY(0) scale(1.15,.85);animation-timing-function:ease-out}
42%{transform:translateY(-4px) scale(1,1);animation-timing-function:ease-in}
46%,88%{transform:translateY(0) scale(1,1);opacity:1}
96%,100%{transform:translateY(0) scale(0);opacity:0}}
@media (prefers-reduced-motion:reduce){
.ring,.tile,.dot{animation:none}.j{animation:none;stroke-dashoffset:0}
.ring{animation:spin 4s linear infinite}}
</style>
<circle cx="120" cy="120" r="104" fill="none" stroke="#8A94B8" stroke-opacity=".2" stroke-width="6"/>
<g class="ring" fill="none" stroke-width="8" stroke-linecap="round">
<circle cx="120" cy="120" r="104" pathLength="100" stroke="#FFC83D" stroke-dasharray="14 86" stroke-dashoffset="0"/>
<circle cx="120" cy="120" r="104" pathLength="100" stroke="#C8265A" stroke-dasharray="14 86" stroke-dashoffset="-33.3"/>
<circle cx="120" cy="120" r="104" pathLength="100" stroke="#0E7C66" stroke-dasharray="14 86" stroke-dashoffset="-66.6"/>
</g>
<g class="tile"><g transform="translate(60 60)">
<path d="M38 4H82A34 34 0 0 1 116 38V82A34 34 0 0 1 82 116H10A6 6 0 0 1 4 110V38A34 34 0 0 1 38 4Z" fill="#FFC83D"/>
<path class="j" pathLength="100" d="M64 46V76C64 90 57 97 44 97" fill="none" stroke="#0F1E3D" stroke-width="12" stroke-linecap="round"/>
<circle class="dot" cx="64" cy="28" r="7.5" fill="#C8265A"/>
</g></g>
</svg>
