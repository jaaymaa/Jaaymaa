<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 24" width="64" height="24" role="img" aria-label="Chargement en cours" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Chargement</title>
<style>
.d{transform-box:fill-box;transform-origin:50% 100%;animation:hop 1.1s ease-in-out infinite}
.d:nth-child(2){animation-delay:.15s}.d:nth-child(3){animation-delay:.3s}
@keyframes hop{0%,60%,100%{transform:translateY(0) scale(1,1)}15%{transform:translateY(0) scale(1.2,.8)}35%{transform:translateY(-8px) scale(.92,1.08)}50%{transform:translateY(0) scale(1.15,.85)}}
@media (prefers-reduced-motion:reduce){.d{animation:none}}
</style>
<circle class="d" cx="12" cy="17" r="5.5" fill="#0F1E3D"/>
<circle class="d" cx="32" cy="17" r="5.5" fill="#0F1E3D"/>
<circle class="d" cx="52" cy="17" r="5.5" fill="#0F1E3D"/>
</svg>
